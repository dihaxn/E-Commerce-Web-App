name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "18.x"
  AZURE_WEBAPP_NAME: "ecommerce-app"
  AZURE_WEBAPP_PACKAGE_PATH: "./publish"

jobs:
  # 🔍 Code Quality & Security Analysis
  security-analysis:
    name: 🔒 Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/E-Commerce-BE/E-Commerce-BE.csproj

      - name: Security scan with CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run security audit
        run: |
          dotnet list src/E-Commerce-BE/E-Commerce-BE.csproj package --vulnerable --include-transitive
          dotnet list src/E-Commerce-BE/E-Commerce-BE.csproj package --deprecated

  # 🧪 Build & Test
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: write
    needs: security-analysis
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "src/E-Commerce-BE/package-lock.json"

      - name: Install npm dependencies
        working-directory: src/E-Commerce-BE
        run: npm ci

      - name: Build Tailwind CSS
        working-directory: src/E-Commerce-BE
        run: npm run css:build

      - name: Restore dependencies
        run: dotnet restore src/E-Commerce-BE/E-Commerce-BE.csproj

      - name: Build application
        run: dotnet build src/E-Commerce-BE/E-Commerce-BE.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/E-Commerce-BE.Tests/E-Commerce-BE.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: tests/E-Commerce-BE.Tests/TestResults/

      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test Results (${{ matrix.os }})
          path: tests/E-Commerce-BE.Tests/TestResults/*/coverage.cobertura.xml
          reporter: java-junit

  # 🐳 Docker Build & Security Scan
  docker-build:
    name: 🐳 Docker Build & Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: src/E-Commerce-BE
          file: src/E-Commerce-BE/Dockerfile
          push: false
          tags: ecommerce-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ecommerce-app:latest"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  # 🚀 Deploy to Staging
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-and-test, docker-build]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm dependencies
        working-directory: src/E-Commerce-BE
        run: npm ci

      - name: Build Tailwind CSS
        working-directory: src/E-Commerce-BE
        run: npm run css:build

      - name: Publish application
        run: dotnet publish src/E-Commerce-BE/E-Commerce-BE.csproj --configuration Release --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}-staging
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}

      - name: Run database migrations
        run: |
          dotnet ef database update --project src/E-Commerce-BE/E-Commerce-BE.csproj --connection "${{ secrets.STAGING_CONNECTION_STRING }}"

      - name: Health check
        run: |
          sleep 30
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}-staging.azurewebsites.net/health || exit 1

  # 🚀 Deploy to Production
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-and-test, docker-build]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm dependencies
        working-directory: src/E-Commerce-BE
        run: npm ci

      - name: Build Tailwind CSS
        working-directory: src/E-Commerce-BE
        run: npm run css:build

      - name: Publish application
        run: dotnet publish src/E-Commerce-BE/E-Commerce-BE.csproj --configuration Release --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Run database migrations
        run: |
          dotnet ef database update --project src/E-Commerce-BE/E-Commerce-BE.csproj --connection "${{ secrets.PRODUCTION_CONNECTION_STRING }}"

      - name: Health check
        run: |
          sleep 30
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health || exit 1

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: "🚀 Production deployment successful!"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # 🔄 Rollback on Failure
  rollback:
    name: 🔄 Rollback
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [deploy-staging, deploy-production]
    if: failure()

    steps:
      - name: Rollback notification
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "❌ Deployment failed! Please check the logs and consider rollback."
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
