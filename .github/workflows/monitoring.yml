name: 📊 Monitoring & Alerting

on:
  schedule:
    - cron: "*/30 * * * *" # Every 30 minutes (reduce noisy notifications)
  workflow_dispatch:

jobs:
  # 🔍 Health Check Monitoring
  health-monitoring:
    name: 🔍 Health Monitoring
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Health check - Production
        id: health-prod
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://ecommerce-app.azurewebsites.net/health)
          echo "status_code=$response" >> $GITHUB_OUTPUT
          if [ $response -eq 200 ]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          fi

      - name: Health check - Staging
        id: health-staging
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://ecommerce-app-staging.azurewebsites.net/health)
          echo "status_code=$response" >> $GITHUB_OUTPUT
          if [ $response -eq 200 ]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          fi

      - name: Database health check
        id: db-health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://ecommerce-app.azurewebsites.net/health/database)
          echo "status_code=$response" >> $GITHUB_OUTPUT
          if [ $response -eq 200 ]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          fi

      - name: Alert on health check failure
        if: (steps.health-prod.outputs.status == 'unhealthy' || steps.db-health.outputs.status == 'unhealthy') && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            🚨 **Health Check Alert**

            **Production Health:** ${{ steps.health-prod.outputs.status }} (Status: ${{ steps.health-prod.outputs.status_code }})
            **Database Health:** ${{ steps.db-health.outputs.status }} (Status: ${{ steps.db-health.outputs.status_code }})

            Please investigate immediately!
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # 📊 Performance Monitoring
  performance-monitoring:
    name: 📊 Performance Monitoring
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install curl and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq bc

      - name: Measure response times
        id: response-times
        run: |
          # Homepage response time
          homepage_time=$(curl -s -o /dev/null -w "%{time_total}" https://ecommerce-app.azurewebsites.net/)
          echo "homepage_time=$homepage_time" >> $GITHUB_OUTPUT

          # Store page response time
          store_time=$(curl -s -o /dev/null -w "%{time_total}" https://ecommerce-app.azurewebsites.net/Store)
          echo "store_time=$store_time" >> $GITHUB_OUTPUT

          # Health endpoint response time
          health_time=$(curl -s -o /dev/null -w "%{time_total}" https://ecommerce-app.azurewebsites.net/health)
          echo "health_time=$health_time" >> $GITHUB_OUTPUT

      - name: Check performance thresholds
        id: performance-check
        run: |
          homepage_time=${{ steps.response-times.outputs.homepage_time }}
          store_time=${{ steps.response-times.outputs.store_time }}
          health_time=${{ steps.response-times.outputs.health_time }}

          # Convert to milliseconds
          homepage_ms=$(echo "$homepage_time * 1000" | bc)
          store_ms=$(echo "$store_time * 1000" | bc)
          health_ms=$(echo "$health_time * 1000" | bc)

          echo "homepage_ms=$homepage_ms" >> $GITHUB_OUTPUT
          echo "store_ms=$store_ms" >> $GITHUB_OUTPUT
          echo "health_ms=$health_ms" >> $GITHUB_OUTPUT

          # Check if any endpoint exceeds 2 seconds
          if (( $(echo "$homepage_time > 2.0" | bc -l) )) || (( $(echo "$store_time > 2.0" | bc -l) )) || (( $(echo "$health_time > 1.0" | bc -l) )); then
            echo "status=slow" >> $GITHUB_OUTPUT
          else
            echo "status=normal" >> $GITHUB_OUTPUT
          fi

      - name: Alert on slow performance
        if: steps.performance-check.outputs.status == 'slow' && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: warning
          text: |
            ⚠️ **Performance Alert**

            **Response Times:**
            - Homepage: ${{ steps.performance-check.outputs.homepage_ms }}ms
            - Store Page: ${{ steps.performance-check.outputs.store_ms }}ms
            - Health Check: ${{ steps.performance-check.outputs.health_ms }}ms

            Some endpoints are responding slowly. Consider investigating.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # 🔒 Security Monitoring
  security-monitoring:
    name: 🔒 Security Monitoring
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check security headers
        id: security-headers
        run: |
          headers=$(curl -s -I https://ecommerce-app.azurewebsites.net/)

          # Check for essential security headers
          if echo "$headers" | grep -q "X-Frame-Options: DENY"; then
            echo "frame_options=present" >> $GITHUB_OUTPUT
          else
            echo "frame_options=missing" >> $GITHUB_OUTPUT
          fi

          if echo "$headers" | grep -q "X-Content-Type-Options: nosniff"; then
            echo "content_type_options=present" >> $GITHUB_OUTPUT
          else
            echo "content_type_options=missing" >> $GITHUB_OUTPUT
          fi

          if echo "$headers" | grep -q "X-XSS-Protection: 1; mode=block"; then
            echo "xss_protection=present" >> $GITHUB_OUTPUT
          else
            echo "xss_protection=missing" >> $GITHUB_OUTPUT
          fi

          if echo "$headers" | grep -q "Strict-Transport-Security"; then
            echo "hsts=present" >> $GITHUB_OUTPUT
          else
            echo "hsts=missing" >> $GITHUB_OUTPUT
          fi

      - name: Check HTTPS enforcement
        id: https-check
        run: |
          http_response=$(curl -s -o /dev/null -w "%{http_code}" http://ecommerce-app.azurewebsites.net/)
          https_response=$(curl -s -o /dev/null -w "%{http_code}" https://ecommerce-app.azurewebsites.net/)

          if [ $http_response -eq 301 ] || [ $http_response -eq 302 ]; then
            echo "http_redirect=working" >> $GITHUB_OUTPUT
          else
            echo "http_redirect=not_working" >> $GITHUB_OUTPUT
          fi

          if [ $https_response -eq 200 ]; then
            echo "https_working=yes" >> $GITHUB_OUTPUT
          else
            echo "https_working=no" >> $GITHUB_OUTPUT
          fi

      - name: Alert on security issues
        if: (steps.security-headers.outputs.frame_options == 'missing' || steps.security-headers.outputs.content_type_options == 'missing' || steps.security-headers.outputs.xss_protection == 'missing' || steps.security-headers.outputs.hsts == 'missing' || steps.https-check.outputs.http_redirect == 'not_working' || steps.https-check.outputs.https_working == 'no') && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            🚨 **Security Alert**

            **Security Headers:**
            - X-Frame-Options: ${{ steps.security-headers.outputs.frame_options }}
            - X-Content-Type-Options: ${{ steps.security-headers.outputs.content_type_options }}
            - X-XSS-Protection: ${{ steps.security-headers.outputs.xss_protection }}
            - HSTS: ${{ steps.security-headers.outputs.hsts }}

            **HTTPS:**
            - HTTP Redirect: ${{ steps.https-check.outputs.http_redirect }}
            - HTTPS Working: ${{ steps.https-check.outputs.https_working }}

            Security configuration issues detected!
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # 📈 Uptime Monitoring
  uptime-monitoring:
    name: 📈 Uptime Monitoring
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Uptime check
        id: uptime-check
        run: |
          # Check multiple endpoints
          endpoints=("/" "/Store" "/health" "/Account/Login")
          failed_endpoints=()

          for endpoint in "${endpoints[@]}"; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "https://ecommerce-app.azurewebsites.net$endpoint")
            if [ $response -ne 200 ]; then
              failed_endpoints+=("$endpoint ($response)")
            fi
          done

          if [ ${#failed_endpoints[@]} -eq 0 ]; then
            echo "status=up" >> $GITHUB_OUTPUT
            echo "failed_endpoints=none" >> $GITHUB_OUTPUT
          else
            echo "status=down" >> $GITHUB_OUTPUT
            echo "failed_endpoints=${failed_endpoints[*]}" >> $GITHUB_OUTPUT
          fi

      - name: Alert on downtime
        if: steps.uptime-check.outputs.status == 'down' && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            🚨 **Uptime Alert**

            **Failed Endpoints:** ${{ steps.uptime-check.outputs.failed_endpoints }}

            Application appears to be down. Immediate attention required!
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # 📊 Generate monitoring report
  monitoring-report:
    name: 📊 Monitoring Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        health-monitoring,
        performance-monitoring,
        security-monitoring,
        uptime-monitoring,
      ]
    if: always()

    steps:
      - name: Generate monitoring report
        run: |
          echo "# 📊 Monitoring Report" >> monitoring-report.md
          echo "Generated on: $(date)" >> monitoring-report.md
          echo "" >> monitoring-report.md
          echo "## System Status" >> monitoring-report.md
          echo "- Health Monitoring: ${{ needs.health-monitoring.result }}" >> monitoring-report.md
          echo "- Performance Monitoring: ${{ needs.performance-monitoring.result }}" >> monitoring-report.md
          echo "- Security Monitoring: ${{ needs.security-monitoring.result }}" >> monitoring-report.md
          echo "- Uptime Monitoring: ${{ needs.uptime-monitoring.result }}" >> monitoring-report.md
          echo "" >> monitoring-report.md
          echo "## Recommendations" >> monitoring-report.md
          echo "- Monitor logs for any recurring issues" >> monitoring-report.md
          echo "- Review performance metrics regularly" >> monitoring-report.md
          echo "- Ensure security headers are properly configured" >> monitoring-report.md
          echo "- Set up additional alerting for critical metrics" >> monitoring-report.md

      - name: Upload monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: monitoring-report.md
