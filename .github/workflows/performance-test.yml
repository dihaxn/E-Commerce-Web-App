name: 🚀 Performance Testing

on:
  schedule:
    - cron: "0 3 * * 0" # Weekly on Sunday at 3 AM
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_type:
        description: "Type of performance test"
        required: true
        default: "load"
        type: choice
        options:
          - load
          - stress
          - spike
          - volume

jobs:
  # 🏃‍♂️ Load Testing
  load-test:
    name: 🏃‍♂️ Load Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.inputs.test_type == 'load' || github.event.inputs.test_type == '' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create k6 load test script
        run: |
          cat > load-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate } from 'k6/metrics';

          const BASE_URL = 'https://ecommerce-app.azurewebsites.net';
          const ERROR_RATE = new Rate('errors');

          export let options = {
            stages: [
              { duration: '2m', target: 10 }, // Ramp up to 10 users
              { duration: '5m', target: 10 }, // Stay at 10 users
              { duration: '2m', target: 20 }, // Ramp up to 20 users
              { duration: '5m', target: 20 }, // Stay at 20 users
              { duration: '2m', target: 0 },  // Ramp down to 0 users
            ],
            thresholds: {
              http_req_duration: ['p(95)<2000'], // 95% of requests must complete below 2s
              http_req_failed: ['rate<0.1'],     // Error rate must be below 10%
              errors: ['rate<0.1'],             // Custom error rate must be below 10%
            },
          };

          export default function() {
            // Test homepage
            let response = http.get(`${BASE_URL}/`);
            check(response, {
              'homepage status is 200': (r) => r.status === 200,
              'homepage response time < 2s': (r) => r.timings.duration < 2000,
            });
            ERROR_RATE.add(response.status !== 200);
            sleep(1);

            // Test product listing
            response = http.get(`${BASE_URL}/Store`);
            check(response, {
              'store page status is 200': (r) => r.status === 200,
              'store page response time < 2s': (r) => r.timings.duration < 2000,
            });
            ERROR_RATE.add(response.status !== 200);
            sleep(1);

            // Test product details (simulate random product)
            const productId = Math.floor(Math.random() * 10) + 1;
            response = http.get(`${BASE_URL}/Store/Details/${productId}`);
            check(response, {
              'product details status is 200': (r) => r.status === 200,
              'product details response time < 2s': (r) => r.timings.duration < 2000,
            });
            ERROR_RATE.add(response.status !== 200);
            sleep(1);

            // Test health endpoint
            response = http.get(`${BASE_URL}/health`);
            check(response, {
              'health check status is 200': (r) => r.status === 200,
              'health check response time < 1s': (r) => r.timings.duration < 1000,
            });
            ERROR_RATE.add(response.status !== 200);
            sleep(1);
          }
          EOF

      - name: Run load test
        run: k6 run load-test.js

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-results/

  # 💪 Stress Testing
  stress-test:
    name: 💪 Stress Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.inputs.test_type == 'stress'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create k6 stress test script
        run: |
          cat > stress-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate } from 'k6/metrics';

          const BASE_URL = 'https://ecommerce-app.azurewebsites.net';
          const ERROR_RATE = new Rate('errors');

          export let options = {
            stages: [
              { duration: '2m', target: 50 },  // Ramp up to 50 users
              { duration: '5m', target: 50 },  // Stay at 50 users
              { duration: '2m', target: 100 }, // Ramp up to 100 users
              { duration: '5m', target: 100 }, // Stay at 100 users
              { duration: '2m', target: 150 }, // Ramp up to 150 users
              { duration: '5m', target: 150 }, // Stay at 150 users
              { duration: '2m', target: 0 },   // Ramp down to 0 users
            ],
            thresholds: {
              http_req_duration: ['p(95)<5000'], // 95% of requests must complete below 5s
              http_req_failed: ['rate<0.2'],     // Error rate must be below 20%
              errors: ['rate<0.2'],             // Custom error rate must be below 20%
            },
          };

          export default function() {
            // Test critical endpoints under stress
            let response = http.get(`${BASE_URL}/`);
            check(response, {
              'homepage status is 200': (r) => r.status === 200,
            });
            ERROR_RATE.add(response.status !== 200);
            sleep(0.5);

            response = http.get(`${BASE_URL}/Store`);
            check(response, {
              'store page status is 200': (r) => r.status === 200,
            });
            ERROR_RATE.add(response.status !== 200);
            sleep(0.5);

            response = http.get(`${BASE_URL}/health`);
            check(response, {
              'health check status is 200': (r) => r.status === 200,
            });
            ERROR_RATE.add(response.status !== 200);
            sleep(0.5);
          }
          EOF

      - name: Run stress test
        run: k6 run stress-test.js

  # 📈 Spike Testing
  spike-test:
    name: 📈 Spike Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.inputs.test_type == 'spike'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create k6 spike test script
        run: |
          cat > spike-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          const BASE_URL = 'https://ecommerce-app.azurewebsites.net';

          export let options = {
            stages: [
              { duration: '1m', target: 10 },   // Normal load
              { duration: '1m', target: 100 },  // Sudden spike
              { duration: '1m', target: 10 },   // Back to normal
              { duration: '1m', target: 200 },  // Another spike
              { duration: '1m', target: 10 },   // Back to normal
            ],
            thresholds: {
              http_req_duration: ['p(95)<3000'], // 95% of requests must complete below 3s
              http_req_failed: ['rate<0.3'],     // Error rate must be below 30%
            },
          };

          export default function() {
            let response = http.get(`${BASE_URL}/`);
            check(response, {
              'homepage status is 200': (r) => r.status === 200,
            });
            sleep(1);
          }
          EOF

      - name: Run spike test
        run: k6 run spike-test.js

  # 📊 Volume Testing
  volume-test:
    name: 📊 Volume Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.inputs.test_type == 'volume'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create k6 volume test script
        run: |
          cat > volume-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          const BASE_URL = 'https://ecommerce-app.azurewebsites.net';

          export let options = {
            stages: [
              { duration: '10m', target: 100 }, // Sustained high volume
            ],
            thresholds: {
              http_req_duration: ['p(95)<4000'], // 95% of requests must complete below 4s
              http_req_failed: ['rate<0.15'],    // Error rate must be below 15%
            },
          };

          export default function() {
            // Simulate various user behaviors
            const endpoints = [
              '/',
              '/Store',
              '/Store/Details/1',
              '/Store/Details/2',
              '/Store/Details/3',
              '/Account/Login',
              '/Account/Register',
              '/health'
            ];

            const endpoint = endpoints[Math.floor(Math.random() * endpoints.length)];
            let response = http.get(`${BASE_URL}${endpoint}`);
            
            check(response, {
              'endpoint status is 200': (r) => r.status === 200,
            });
            
            sleep(Math.random() * 2 + 1); // Random sleep between 1-3 seconds
          }
          EOF

      - name: Run volume test
        run: k6 run volume-test.js

  # 📈 Performance Report
  performance-report:
    name: 📈 Performance Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [load-test, stress-test, spike-test, volume-test]
    if: always()

    steps:
      - name: Generate performance report
        run: |
          echo "# 🚀 Performance Test Report" >> performance-report.md
          echo "Generated on: $(date)" >> performance-report.md
          echo "" >> performance-report.md
          echo "## Test Results" >> performance-report.md
          echo "- Load Test: ${{ needs.load-test.result }}" >> performance-report.md
          echo "- Stress Test: ${{ needs.stress-test.result }}" >> performance-report.md
          echo "- Spike Test: ${{ needs.spike-test.result }}" >> performance-report.md
          echo "- Volume Test: ${{ needs.volume-test.result }}" >> performance-report.md
          echo "" >> performance-report.md
          echo "## Recommendations" >> performance-report.md
          echo "- Monitor response times under load" >> performance-report.md
          echo "- Consider caching strategies for high-traffic endpoints" >> performance-report.md
          echo "- Implement auto-scaling for traffic spikes" >> performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.md

      - name: Notify performance results
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Performance test completed: ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
