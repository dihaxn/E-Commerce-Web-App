name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "18.x"

jobs:
  # 🔍 Code Quality & Security Analysis
  security-analysis:
    name: 🔒 Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Security scan with CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Restore dependencies
        run: dotnet restore src/E-Commerce-BE/E-Commerce-BE.csproj

      - name: Build application
        run: dotnet build src/E-Commerce-BE/E-Commerce-BE.csproj --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run security audit
        run: |
          dotnet list src/E-Commerce-BE/E-Commerce-BE.csproj package --vulnerable --include-transitive
          dotnet list src/E-Commerce-BE/E-Commerce-BE.csproj package --deprecated

  # 🧪 Build & Test
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
      pull-requests: write
      checks: write
    needs: security-analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "src/E-Commerce-BE/package-lock.json"

      - name: Install npm dependencies
        working-directory: src/E-Commerce-BE
        run: npm ci

      - name: Build Tailwind CSS
        working-directory: src/E-Commerce-BE
        run: npm run css:build

      - name: Restore dependencies
        run: dotnet restore src/E-Commerce-BE/E-Commerce-BE.csproj

      - name: Build application
        run: dotnet build src/E-Commerce-BE.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test tests/E-Commerce-BE.Tests/E-Commerce-BE.Tests.csproj
          --configuration Release
          --verbosity normal
          --results-directory tests/E-Commerce-BE.Tests/TestResults
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: tests/E-Commerce-BE.Tests/TestResults/

      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test Results (Windows)
          path: tests/E-Commerce-BE.Tests/TestResults/**/*.trx
          reporter: dotnet-trx

      - name: Upload coverage file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-windows
          path: tests/E-Commerce-BE.Tests/TestResults/**/coverage.cobertura.xml

      - name: Check coverage files before processing
        shell: pwsh
        run: |
          Write-Host "Checking for coverage files..."
          if (Test-Path "tests/E-Commerce-BE.Tests/TestResults") {
            Write-Host "TestResults directory found. Contents:"
            Get-ChildItem -Recurse "tests/E-Commerce-BE.Tests/TestResults" | Select-Object FullName
          } else {
            Write-Host "TestResults directory not found"
          }

      - name: Generate coverage summary
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.0
        if: success() || failure()
        with:
          reports: tests/E-Commerce-BE.Tests/TestResults/**/coverage.cobertura.xml
          targetdir: "coveragereport"
          reporttypes: "Html_Dark;Badges"
          assemblyfilters: "+E-Commerce-BE"
        continue-on-error: true

      - name: Verify coverage report generation
        shell: pwsh
        run: |
          Write-Host "Checking ReportGenerator output..."
          if (Test-Path "coveragereport") {
            Write-Host "coveragereport directory found. Contents:"
            Get-ChildItem -Recurse "coveragereport" | Select-Object FullName
          } else {
            Write-Host "coveragereport directory not found - ReportGenerator may have failed"
          }

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-windows
          path: coveragereport

      - name: Update coverage badge
        shell: pwsh
        if: always()
        run: |
          # Create badge directory if it doesn't exist
          if (!(Test-Path ".github/badges")) {
            New-Item -ItemType Directory -Path ".github/badges" -Force
            Write-Host "Created .github/badges directory"
          }

          # Check if coverage badge was generated
          if (Test-Path "coveragereport/badges/linecoverage.svg") {
            Write-Host "Coverage badge found, updating..."
            # Copy the new badge to a known location
            Copy-Item "coveragereport/badges/linecoverage.svg" ".github/badges/coverage.svg" -Force
            
            # Configure git
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            
            # Add the badge file
            git add .github/badges/coverage.svg
            
            # Check if there are changes to commit
            $changes = git diff --staged --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "ci: update coverage badge"
              git push
              Write-Host "Coverage badge updated and committed"
            } else {
              Write-Host "No changes to coverage badge"
            }
          } else {
            Write-Host "Coverage badge not generated - this is expected if no tests ran or coverage collection failed"
            Write-Host "This will not fail the build"
          }

  # 🐳 Docker Build & Security Scan
  docker-build:
    name: 🐳 Docker Build & Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug filesystem before Docker build
        run: |
          echo "Current directory:"
          pwd
          echo "Contents of current directory:"
          ls -la
          echo "Contents of src/E-Commerce-BE:"
          ls -la src/E-Commerce-BE/
          echo "Checking if Dockerfile exists:"
          test -f src/E-Commerce-BE/Dockerfile && echo "Dockerfile exists" || echo "Dockerfile NOT found"

      - name: Build Docker image
        run: |
          cd src/E-Commerce-BE
          docker build -t ecommerce-app:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ecommerce-app:latest"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  # 🚀 Deploy to Oracle Cloud Staging
  deploy-oci-staging:
    name: 🌥️ Deploy to OCI Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-and-test, docker-build]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')

    steps:
      - name: Trigger Oracle Cloud Deployment
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'oci-deploy.yml',
              ref: 'main',
              inputs: {
                environment: 'staging'
              }
            });
            console.log('Oracle Cloud deployment triggered:', result.status);

  # 🚀 Deploy to Oracle Cloud Production
  deploy-oci-production:
    name: 🌥️ Deploy to OCI Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-and-test, docker-build]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
      - name: Trigger Oracle Cloud Deployment
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'oci-deploy.yml',
              ref: 'main',
              inputs: {
                environment: 'production'
              }
            });
            console.log('Oracle Cloud deployment triggered:', result.status);
